# Publishes n8n-nodes-clientify to npm when a `v*` tag is pushed.
#
# Ready for TRUSTED PUBLISHING (OIDC): once npmjs.com is configured to trust
# this repo + this workflow file for the package, npm authenticates with a
# short-lived signed token and no NPM_TOKEN is needed. `NODE_AUTH_TOKEN` stays
# as a fallback during the transition; the CLI tries OIDC first and only falls
# back to the token if OIDC is not available.
#
# ⚠️ `runs-on` MUST be a GitHub-hosted runner, never one of our self-hosted ones:
#   (a) trusted publishing only supports cloud-hosted runners;
#   (b) in a public repo, a PR from a fork would run on our cluster.
name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required: this is what allows issuing the OIDC token that both
      # provenance and trusted publishing rely on.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22: npm@latest (12.x) requires node 22+, and the npm 10.x bundled
          # with node 20 silently IGNORES OIDC (trusted publishing exists since
          # npm 11.5.1). The node builds the same on 22.
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      # With trusted publishing `--provenance` is redundant (it is generated
      # automatically), but being explicit is harmless and covers token publishing.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
